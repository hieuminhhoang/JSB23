<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .btn {
      background-color: #e4002b;
      color: whitesmoke;
      font-size: 25px;
      padding: 10px 30px;
      width: fit-content;
      border-radius: 20px;
      display: inline-block;
      /* width: fit-content */
    }

    .line2 {
      background-color: aqua;
      width: 500px;
      height: 500px;
      padding: 10px;
      margin-left: 10px;
      margin-right: 10px;
      margin-top: 100px;
      display: inline-block;
    }

  </style>
</head>
<body>
  
  <div class="btn">
    Bắt đầu đặt hàng
  </div>

  <div class="btn">
    Bắt đầu đặt hàng
  </div>

  <div class="btn">
    Bắt đầu đặt hàng
  </div>

  <div class="btn">
    Bắt đầu đặt hàng
  </div>

  <!-- 
    Thẻ có tính chất display: inline
    - span, u, i, b
    => Khi những thẻ có tính inline viết cạnh nhau thì lên UI nẽ sẽ nằm ngang hàng với nhau
    Note: inline thì không chỉnh được width, height, margin-top, margin-bottom

    Thẻ có tính chất display: inline-block
    => Có thể chỉnh được mọi CSS và vẫn dữ tính chất inline
  -->

  <p>Dòng 1</p>
  <span class="line2">Dòng 2</span>
  <span class="line3">Dòng 3</span>
</body>
</html>
