<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang web đầu tiên</title>
</head>
<body>   

    <!-- the h :heading (h1->h6) sai chữ nhỏ dần ghi thẻ h tăng  -->
    <h1> Hoang Minh Hieu</h1>
    <h2> Hoang Minh Hieu</h2>


    <!-- thẻ p: paragraph -->
    <p>Đây là một đoạn văn bản.</p>

    <!-- thẻ img: hình ảnh
     - thuộc tính src: source => Nguồn ảnh
     - thuộc tính alt: hiển thị nội dung khi ảnh bị lỗi
    -->
    <img width="200px" src="https://fptcloud.com/wp-content/uploads/2024/11/he-thong-ha-tang-may-chu-vat-ly-fptcloud-768x511.webp" alt="Mô tả hình ảnh">


    <!-- thẻ a: đường dẫn link 
      -href: hyperlink reference => đường dẫn
      -
    -->

    <a href="https://vinuni.edu.vn/vi/trang-chu/" >Dẫn sang trang vinuni</a>
        <!-- thẻ u=underline -->
     <p>Thời tiết <u> hà nội </u> nay rất đẹp</p>
     <!--  thẻ b= bold -->
       <p>Thời tiết <b>hà nội</b>rất đẹp </p>
    <!-- thẻ i = italic -->
     <p>thời tiết <i>hà nội</i>rất đẹp</p>
     <!-- thẻ ul: unorder list -->
      <ul>
        <li> Bánh chuối</li>
        <li>bun cha</li>
        <li>sinh to</li>
      </ul>
      <!-- thẻ ol :onorder list -->
      <ol>
        <li> Bánh chuối</li>
        <li>bun cha</li>
        <li>sinh to</li>
      </ol>

</body>
</html>
