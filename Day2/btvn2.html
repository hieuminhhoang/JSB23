<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combo Nhóm 2 Hoàn Hảo</title>
    <style>
        .combo-box {
            width: 320px;
            border: 2px solid black;
            border-radius: 10px;

        }

        .combo-img {
            width: 100%;
            height: 200px;
            display: block;
        }

        .combo-info {
            padding: 15px;
        }

        .combo-title {
            font-size: 22px;
            font-weight: bold;
            padding: 5px 0;
        }

        .combo-price {
            font-size: 20px;
            font-weight: bold;
            color: red;
            padding: 5px 0;
        }

        .combo-desc {
            font-size: 16px;
            padding: 5px 0;
        }

        .combo-btn {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            background-color: #ff0000;
            color: #fff;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <h1>Danh mục món ăn</h1>

    <div class="combo-box">
        <img class="combo-img" src="https://static.kfcvietnam.com.vn/images/category/lg/COMBO%20NHOM.jpg?v=gdYXJ3"
            alt="Combo Nhóm 2 Hoàn Hảo">
        <div class="combo-info">
            <h2 class="combo-title">Combo Nhóm 2 Hoàn Hảo</h2>
            <div class="combo-price">135.000₫</div>
            <p class="combo-desc">2 Miếng Gà Rán + 1 Burger Zinger + 2 Ly Pepsi (Tiêu chuẩn) + 3 Gói tương (cà/ớt)</p>
            <p class="combo-btn">Thêm</p>
        </div>
    </div>

</body>

</html>
